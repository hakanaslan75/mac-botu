name: Mac botu

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"   # her 10 dakikada bir, her gün (milli maç günleri de dahil; GitHub bazen geciktirir)
  workflow_dispatch:                      # elle ya da botun kendisi tarafından başlatmak için

permissions:
  contents: write               # gönderilenler listesini (durum.json) kaydetmek için
  actions: write                # maç sürerken bir sonraki turu kendisi başlatabilsin diye

concurrency:
  group: mac-botu
  cancel-in-progress: false     # aynı anda tek kopya çalışsın

jobs:
  calis:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Botu calistir
        id: bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIGLER: ${{ vars.LIGLER }}
          TAKIMLAR: ${{ vars.TAKIMLAR }}
          MILLI_LIGLER: ${{ vars.MILLI_LIGLER }}
          MILLI_TAKIMLAR: ${{ vars.MILLI_TAKIMLAR }}
        run: python3 bot.py --dongu 25

      - name: Gonderilenleri kaydet
        if: always()
        run: |
          git config user.name "mac-botu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f durum.json ]; then
            git add durum.json
            git diff --cached --quiet || (git commit -m "durum guncellendi" && git pull --rebase && git push)
          fi

      - name: Mac suruyorsa bir sonraki turu baslat
        if: always() && steps.bot.outputs.devam == 'evet'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mac_botu.yml --ref "${{ github.ref_name }}"
